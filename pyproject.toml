[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "european-power-research-agent"
version = "0.1.0"
description = "A benchmarkable Responses API harness for multi-step European power-market research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Jacob Mackey" },
]
dependencies = [
  "openai>=2.51.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
power-research-agent = "power_research_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/power_research_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
